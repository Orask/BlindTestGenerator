name: Daily Pipeline

on:
  schedule:
    # 3:00 UTC — deliberately earlier than the ~8h Swiss target (5:00 UTC in
    # summer / 7:00 in winter). GitHub's scheduler doesn't guarantee the
    # nominal time: a 6:00 UTC cron (= 8:00 CEST on paper) was observed
    # actually firing around 13:00 Swiss time, a ~5h delay, and a later run
    # fired at 09:06 instead of 03:00, a ~6h delay — GitHub Actions'
    # `schedule` is simply never on-time for a low-traffic repo like this
    # one. Kept as a pure fallback, not the primary trigger: see the
    # `repository_dispatch` type below for the on-time path, and
    # docs/CAHIER_DES_CHARGES.md for the external scheduler setup. Both
    # firing the same day is expected and handled (see
    # hasUploadedVideoForThemeToday in runPipeline) rather than something
    # this schedule needs to avoid.
    - cron: "0 3 * * *"
  # Fired by an external scheduler (see docs/CAHIER_DES_CHARGES.md, section
  # "Déclenchement fiable du run quotidien") hitting GitHub's
  # `POST /repos/{owner}/{repo}/dispatches` REST API at the actual target
  # time — unlike `schedule` above, a repository_dispatch fires immediately,
  # since it's a direct API call rather than a queued cron slot GitHub
  # schedules best-effort. `event_type` is arbitrary but must match exactly
  # what the external scheduler sends.
  repository_dispatch:
    types: [daily-pipeline-trigger]
  workflow_dispatch: {}

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # Remotion's headless Chromium needs these on a bare Ubuntu runner —
      # not all are preinstalled on ubuntu-latest.
      - name: Install Chromium runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libdbus-1-3 libatk1.0-0 libgbm1 libasound2t64 \
            libxrandr2 libxkbcommon0 libxfixes3 libxcomposite1 \
            libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2

      - name: Run pipeline
        working-directory: apps/pipeline
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          # Optional extra Spotify apps for rate-limit failover (see
          # .env.example and packages/integrations/spotify/src/rotating-client.ts).
          # An unset repo secret resolves to an empty string, which the
          # pipeline treats the same as not configuring it — safe to leave
          # these two lines in place even before any extra app exists.
          SPOTIFY_CLIENT_ID_2: ${{ secrets.SPOTIFY_CLIENT_ID_2 }}
          SPOTIFY_CLIENT_SECRET_2: ${{ secrets.SPOTIFY_CLIENT_SECRET_2 }}
          SPOTIFY_CLIENT_ID_3: ${{ secrets.SPOTIFY_CLIENT_ID_3 }}
          SPOTIFY_CLIENT_SECRET_3: ${{ secrets.SPOTIFY_CLIENT_SECRET_3 }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          # Optional: the AI episode review (apps/pipeline/src/review-episode.ts)
          # only runs when this secret is set — an empty/missing value is
          # treated the same as not configuring it at all, no other change needed.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node dist/index.js ../../channels/blindtest-fr.json

      # Actions runners have no persistent disk between runs — the committed
      # DB file is the anti-repeat/cooldown history across days (see
      # .gitignore). Also commits channels/*.json, which the pipeline
      # itself may have appended newly-discovered artists to (see
      # apps/pipeline/src/persist-discovered-artists.ts) when a theme's
      # seedArtists ran short. Runs even if the pipeline step failed, since
      # a failed run can still leave an informative draft/failed video row.
      - name: Persist database state
        if: always()
        working-directory: apps/pipeline
        run: |
          node -e "require('better-sqlite3')('../../data/blindtest.sqlite').pragma('wal_checkpoint(TRUNCATE)')"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ../../data/blindtest.sqlite ../../channels/*.json
          git diff --cached --quiet || git commit -m "chore(data): mise à jour de la base après le run du $(date -u +%Y-%m-%d)"
          git push
